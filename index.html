<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветовой тест</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info {
            margin: 20px 0;
            font-size: 1.2em;
        }

        .level {
            font-size: 1.5em;
            font-weight: bold;
            margin: 15px 0;
            color: #ffeb3b;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 30px auto;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 15px;
        }

        .square {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid transparent;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .square:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .square:active {
            transform: scale(0.95);
        }

        .message {
            margin: 20px 0;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 30px;
        }

        .success {
            color: #4caf50;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .error {
            color: #f44336;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .complete {
            color: #ffeb3b;
            font-size: 1.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .restart-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        @media (max-width: 480px) {
            .square {
                width: 60px;
                height: 60px;
            }
            
            .grid {
                max-width: 220px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Цветовой тест</h1>
        <div class="info">Найдите квадрат отличающегося цвета</div>
        <div class="level">Уровень: <span id="level">1</span> / 50</div>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="grid" id="grid">
            <!-- Квадраты будут добавлены через JavaScript -->
        </div>
        
        <div class="message" id="message">Кликните на отличающийся квадрат</div>
        
        <button class="restart-btn" id="restartBtn" onclick="restartGame()" style="display: none;">
            🔄 Начать заново
        </button>
    </div>

    <script>
        let currentLevel = 1;
        let differentSquareIndex = 0;
        let gameCompleted = false;
        let errorCount = 0;
        let maxErrors = 10;
        let currentDifference = 30;
        let testResults = []; // Массив для хранения результатов каждого уровня
        let consecutiveCorrect = 0; // Счетчик правильных ответов подряд

        const grid = document.getElementById('grid');
        const levelElement = document.getElementById('level');
        const messageElement = document.getElementById('message');
        const restartBtn = document.getElementById('restartBtn');
        const progressBar = document.getElementById('progressBar');

        // Функция для преобразования RGB в HEX
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        // Функция для преобразования HEX в RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function generateLevel() {
            if (currentLevel > 50 || errorCount >= maxErrors) {
                completeGame();
                return;
            }

            // Очищаем сетку
            grid.innerHTML = '';
            
            // Генерируем базовый цвет
            const baseR = 80 + Math.floor(Math.random() * 96);
            const baseG = 80 + Math.floor(Math.random() * 96);
            const baseB = 80 + Math.floor(Math.random() * 96);
            const baseColor = rgbToHex(baseR, baseG, baseB);
            
            // Логика адаптивного изменения сложности
            // Если 3 правильных ответа подряд - уменьшаем разность
            if (consecutiveCorrect >= 3 && currentDifference > 2) {
                currentDifference = Math.max(2, currentDifference - 2);
                consecutiveCorrect = 0;
            }
            
            // Определяем, какой квадрат будет отличаться
            differentSquareIndex = Math.floor(Math.random() * 9);
            
            // Логика изменения каналов в зависимости от текущей сложности
            let diffR = baseR;
            let diffG = baseG;
            let diffB = baseB;
            
            if (currentDifference >= 15) {
                // Легкий уровень: изменяем все три канала
                const directionR = Math.random() < 0.5 ? 1 : -1;
                const directionG = Math.random() < 0.5 ? 1 : -1;
                const directionB = Math.random() < 0.5 ? 1 : -1;
                
                diffR = Math.max(20, Math.min(235, baseR + (currentDifference * directionR)));
                diffG = Math.max(20, Math.min(235, baseG + (currentDifference * directionG)));
                diffB = Math.max(20, Math.min(235, baseB + (currentDifference * directionB)));
                
            } else if (currentDifference >= 8) {
                // Средний уровень: изменяем два канала
                const channels = [0, 1, 2];
                const selectedChannels = [];
                
                for (let i = 0; i < 2; i++) {
                    const randomIndex = Math.floor(Math.random() * channels.length);
                    selectedChannels.push(channels[randomIndex]);
                    channels.splice(randomIndex, 1);
                }
                
                selectedChannels.forEach(channel => {
                    const direction = Math.random() < 0.5 ? 1 : -1;
                    if (channel === 0) {
                        diffR = Math.max(20, Math.min(235, baseR + (currentDifference * direction)));
                    } else if (channel === 1) {
                        diffG = Math.max(20, Math.min(235, baseG + (currentDifference * direction)));
                    } else {
                        diffB = Math.max(20, Math.min(235, baseB + (currentDifference * direction)));
                    }
                });
                
            } else {
                // Сложный уровень: изменяем один канал
                const colorChannel = Math.floor(Math.random() * 3);
                const direction = Math.random() < 0.5 ? 1 : -1;
                
                if (colorChannel === 0) {
                    diffR = Math.max(20, Math.min(235, baseR + (currentDifference * direction)));
                } else if (colorChannel === 1) {
                    diffG = Math.max(20, Math.min(235, baseG + (currentDifference * direction)));
                } else {
                    diffB = Math.max(20, Math.min(235, baseB + (currentDifference * direction)));
                }
            }
            
            const differentColor = rgbToHex(diffR, diffG, diffB);
            
            // Сохраняем данные для результатов
            const levelData = {
                level: currentLevel,
                baseColor: baseColor,
                differentColor: differentColor,
                difference: currentDifference,
                baseRGB: {r: baseR, g: baseG, b: baseB},
                diffRGB: {r: diffR, g: diffG, b: diffB},
                success: null // будет заполнено после ответа
            };
            
            // Создаем квадраты
            for (let i = 0; i < 9; i++) {
                const square = document.createElement('div');
                square.className = 'square';
                
                if (i === differentSquareIndex) {
                    square.style.backgroundColor = differentColor;
                } else {
                    square.style.backgroundColor = baseColor;
                }
                
                square.addEventListener('click', () => handleSquareClick(i, levelData));
                grid.appendChild(square);
            }
            
            // Обновляем интерфейс
            levelElement.textContent = currentLevel;
            messageElement.textContent = `Ошибок: ${errorCount}/${maxErrors} | Различие: ${currentDifference}`;
            messageElement.className = 'message';
            
            // Обновляем прогресс-бар
            const progress = (currentLevel / 50) * 100;
            progressBar.style.width = progress + '%';
        }

        function handleSquareClick(index, levelData) {
            if (gameCompleted) return;
            
            if (index === differentSquareIndex) {
                // Правильный ответ
                levelData.success = true;
                testResults.push(levelData);
                consecutiveCorrect++;
                
                messageElement.textContent = '✅ Правильно!';
                messageElement.className = 'message success';
                
                currentLevel++;
                
                setTimeout(() => {
                    generateLevel();
                }, 1000);
                
            } else {
                // Неправильный ответ
                levelData.success = false;
                testResults.push(levelData);
                errorCount++;
                consecutiveCorrect = 0;
                
                messageElement.textContent = `❌ Ошибка ${errorCount}/${maxErrors}`;
                messageElement.className = 'message error';
                
                // Подсветим правильный квадрат
                const squares = grid.children;
                squares[differentSquareIndex].style.border = '3px solid #ffeb3b';
                squares[differentSquareIndex].style.boxShadow = '0 0 20px #ffeb3b';
                
                if (errorCount >= maxErrors) {
                    setTimeout(() => {
                        completeGame();
                    }, 2000);
                } else {
                    setTimeout(() => {
                        squares[differentSquareIndex].style.border = '3px solid transparent';
                        squares[differentSquareIndex].style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.2)';
                        currentLevel++;
                        generateLevel();
                    }, 2000);
                }
            }
        }

        function completeGame() {
            gameCompleted = true;
            grid.style.display = 'none';
            
            if (errorCount >= maxErrors) {
                messageElement.textContent = `🔴 Тест завершен: достигнуто ${maxErrors} ошибок`;
            } else {
                messageElement.textContent = '🎉 Поздравляем! Вы прошли все 50 уровней!';
            }
            messageElement.className = 'message complete';
            
            // Создаем диаграмму результатов
            createResultsChart();
            restartBtn.style.display = 'inline-block';
        }

        function createResultsChart() {
            const chartContainer = document.createElement('div');
            chartContainer.style.cssText = `
                margin-top: 30px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 15px;
                padding: 20px;
                backdrop-filter: blur(10px);
            `;
            
            const chartTitle = document.createElement('h3');
            chartTitle.textContent = '📊 Результаты теста';
            chartTitle.style.cssText = `
                color: white;
                text-align: center;
                margin-bottom: 20px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            `;
            
            const chartGrid = document.createElement('div');
            chartGrid.style.cssText = `
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 15px;
                max-height: 400px;
                overflow-y: auto;
            `;
            
            // Статистика
            const stats = document.createElement('div');
            const correctAnswers = testResults.filter(r => r.success).length;
            const incorrectAnswers = testResults.filter(r => !r.success).length;
            const minDifference = Math.min(...testResults.map(r => r.difference));
            
            stats.innerHTML = `
                <h4 style="color: #ffeb3b; margin-bottom: 10px;">📈 Статистика:</h4>
                <p style="color: white; margin: 5px 0;">✅ Правильных ответов: ${correctAnswers}</p>
                <p style="color: white; margin: 5px 0;">❌ Ошибок: ${incorrectAnswers}</p>
                <p style="color: white; margin: 5px 0;">🎯 Минимальное различие: ${minDifference}</p>
                <p style="color: white; margin: 5px 0;">📊 Достигнутый уровень: ${currentLevel - 1}</p>
            `;
            
            chartGrid.appendChild(stats);
            
            // Показываем ошибки
            const errorResults = testResults.filter(r => !r.success);
            if (errorResults.length > 0) {
                const errorsContainer = document.createElement('div');
                errorsContainer.innerHTML = '<h4 style="color: #f44336; margin-bottom: 10px;">❌ Цвета с ошибками:</h4>';
                
                errorResults.forEach((result, index) => {
                    const errorItem = document.createElement('div');
                    errorItem.style.cssText = `
                        display: flex;
                        align-items: center;
                        margin: 8px 0;
                        padding: 8px;
                        background: rgba(244, 67, 54, 0.1);
                        border-radius: 8px;
                        border-left: 3px solid #f44336;
                    `;
                    
                    errorItem.innerHTML = `
                        <div style="width: 30px; height: 30px; background: ${result.baseColor}; margin-right: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);"></div>
                        <div style="width: 30px; height: 30px; background: ${result.differentColor}; margin-right: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);"></div>
                        <div style="color: white; font-size: 12px;">
                            <div>Уровень ${result.level}</div>
                            <div>Различие: ${result.difference}</div>
                        </div>
                    `;
                    
                    errorsContainer.appendChild(errorItem);
                });
                
                chartGrid.appendChild(errorsContainer);
            }
            
            // Показываем успешные цвета (последние несколько)
            const successResults = testResults.filter(r => r.success).slice(-10);
            if (successResults.length > 0) {
                const successContainer = document.createElement('div');
                successContainer.innerHTML = '<h4 style="color: #4caf50; margin-bottom: 10px;">✅ Последние успешные:</h4>';
                
                successResults.forEach((result, index) => {
                    const successItem = document.createElement('div');
                    successItem.style.cssText = `
                        display: flex;
                        align-items: center;
                        margin: 8px 0;
                        padding: 8px;
                        background: rgba(76, 175, 80, 0.1);
                        border-radius: 8px;
                        border-left: 3px solid #4caf50;
                    `;
                    
                    successItem.innerHTML = `
                        <div style="width: 30px; height: 30px; background: ${result.baseColor}; margin-right: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);"></div>
                        <div style="width: 30px; height: 30px; background: ${result.differentColor}; margin-right: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);"></div>
                        <div style="color: white; font-size: 12px;">
                            <div>Уровень ${result.level}</div>
                            <div>Различие: ${result.difference}</div>
                        </div>
                    `;
                    
                    successContainer.appendChild(successItem);
                });
                
                chartGrid.appendChild(successContainer);
            }
            
            chartContainer.appendChild(chartTitle);
            chartContainer.appendChild(chartGrid);
            
            const container = document.querySelector('.container');
            container.insertBefore(chartContainer, restartBtn);
        }

        function restartGame() {
            currentLevel = 1;
            gameCompleted = false;
            errorCount = 0;
            currentDifference = 30;
            testResults = [];
            consecutiveCorrect = 0;
            
            // Удаляем диаграмму результатов если она есть
            const existingChart = document.querySelector('.container > div:not(.grid):not(.progress):not(.info):not(.level):not(.message)');
            if (existingChart && existingChart !== restartBtn.parentElement) {
                existingChart.remove();
            }
            
            restartBtn.style.display = 'none';
            grid.style.display = 'grid';
            progressBar.style.width = '0%';
            generateLevel();
        }

        // Запускаем игру
        generateLevel();
    </script>
</body>
</html>
